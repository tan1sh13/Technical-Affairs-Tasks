<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNova Fest 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>TechNova Fest 2026</h1>
<p>Innovation • Coding • Robotics • Networking</p>
</header>

<section>
<h2>Countdown to the Event</h2>
<div id="countdown"></div>
</section>

<section>
<h2>Event Schedule</h2>
<div class="schedule">
<div class="card"><h3>09:00 AM</h3><p>Opening Ceremony</p></div>
<div class="card"><h3>10:30 AM</h3><p>Hackathon Begins</p></div>
<div class="card"><h3>02:00 PM</h3><p>Workshop Session</p></div>
<div class="card"><h3>06:00 PM</h3><p>Project Showcase</p></div>
</div>
</section>

<section>
<h2>Register Now</h2>
<form id="registrationForm">
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="College Email" required>
<input type="text" id="roll" placeholder="Roll Number (CS25B1009)" required>
<button type="submit">Register</button>
</form>
<p id="message"></p>
</section>

<script src="script.js"></script>
</body>
</html>
